<!doctype html>
<html lang="sw" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tazama — Tanzania's Video-Sharing Platform | Tazama. Unda. Pata.</title>
    <meta name="description" content="Tazama ni jukwaa la video la Tanzania na Afrika. Tazama maudhui unayopenda, unda video zako, na pata mapato." />
    <meta property="og:title" content="Tazama — Tanzania's Video-Sharing Platform" />
    <meta property="og:description" content="Tazama. Unda. Pata. Jukwaa la kisasa la video kwa ajili ya waundaji na watazamaji Tanzania na Afrika." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#FF3040" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tazama" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #10131B;
        color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html.light, html.light body {
        background-color: #F4F6F9;
        color: #0F172A;
      }
      @keyframes tzBootSpin {
        to { transform: rotate(360deg); }
      }
      .tz-boot-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .tz-boot-logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #FF3040, #FF6B6B);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 28px rgba(255, 48, 64, 0.35);
      }
      .tz-boot-triangle {
        width: 0;
        height: 0;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 15px solid #FFFFFF;
        margin-left: 4px;
      }
      .tz-boot-spinner {
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        border: 2.5px solid rgba(255, 48, 64, 0.25);
        border-top-color: #FF3040;
        animation: tzBootSpin 0.8s linear infinite;
      }
      .tz-boot-recovery {
        display: none;
        margin-top: 12px;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .tz-boot-btn {
        background: #FF3040;
        color: #FFFFFF;
        border: none;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tazama_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F9] dark:bg-[#10131B] text-[#0F172A] dark:text-white antialiased selection:bg-[#FF3040] selection:text-white min-h-screen transition-colors duration-200">
    <div id="root">
      <div data-tazama-boot="1" class="tz-boot-screen">
        <div class="tz-boot-logo">
          <div class="tz-boot-triangle"></div>
        </div>
        <div style="font-size: 18px; font-weight: 800; letter-spacing: 0.04em;">TAZAMA</div>
        <div class="tz-boot-spinner"></div>
        <div id="tz-boot-recovery" class="tz-boot-recovery">
          <div style="font-size: 12px; opacity: 0.8; max-width: 260px;">
            App inachukua muda kupakia au cache ya zamani imekwama.
          </div>
          <button
            type="button"
            class="tz-boot-btn"
            onclick="window.__tazamaHardReload && window.__tazamaHardReload()"
          >
            Pakia Upya App
          </button>
        </div>
      </div>
    </div>
    <script>
      window.__tazamaHardReload = function() {
        var finish = function() { window.location.reload(); };
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {}).finally(function() {
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).catch(function() {}).finally(finish);
              } else {
                finish();
              }
            });
            return;
          }
        } catch(e) {}
        finish();
      };
      setTimeout(function() {
        var boot = document.querySelector('[data-tazama-boot]');
        var rec = document.getElementById('tz-boot-recovery');
        if (boot && rec) {
          rec.style.display = 'flex';
        }
      }, 6500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
