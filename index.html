<!doctype html>
<html lang="sw" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tazama — Tanzania's Video-Sharing Platform | Tazama. Unda. Pata.</title>
    <meta name="description" content="Tazama ni jukwaa la video la Tanzania na Afrika. Tazama maudhui unayopenda, unda video zako, na pata mapato." />
    <meta property="og:title" content="Tazama — Tanzania's Video-Sharing Platform" />
    <meta property="og:description" content="Tazama. Unda. Pata. Jukwaa la kisasa la video kwa ajili ya waundaji na watazamaji Tanzania na Afrika." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#FF3040" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tazama_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F9] dark:bg-[#10131B] text-[#0F172A] dark:text-white antialiased selection:bg-[#FF3040] selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
